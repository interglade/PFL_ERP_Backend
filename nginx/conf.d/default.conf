# Upstream for Node.js application (Docker service: app_primefresh)
upstream app_backend {
    server app:4000;
    keepalive 32;
}

# Main server block
server {
    listen 8004;
    server_name localhost;
    
    # Add custom header to identify the service
    add_header X-Service-Port "8004" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Root directory for static files
    root /var/www;
    
    # API routes - proxy to Node.js application
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        
        # Proxy settings
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Sales Target API routes
    location /sales-target/ {
        limit_req zone=api burst=15 nodelay;
        
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Extended timeout for Excel generation
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # File serving for exports (Excel files, PDFs, etc.)
    location /files/exports/ {
        limit_req zone=files burst=10 nodelay;
        
        alias /var/www/exports/;
        
        # Security: Only allow specific file types
        location ~* \.(xlsx|xls|pdf|csv|txt)$ {
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            
            # Enable range requests for large files
            add_header Accept-Ranges bytes;
            
            # CORS headers for frontend access
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            
            try_files $uri =404;
        }
        
        # Block access to other file types
        location ~* \.(php|html|htm|js)$ {
            deny all;
        }
    }

    # File serving for uploads
    location /files/uploads/ {
        limit_req zone=files burst=10 nodelay;
        
        alias /var/www/uploads/;
        
        # Security: Only allow specific file types
        location ~* \.(jpg|jpeg|png|gif|pdf|xlsx|xls|csv|txt)$ {
            add_header X-Content-Type-Options "nosniff";
            add_header Cache-Control "public, max-age=3600";
            
            # CORS headers
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            
            try_files $uri =404;
        }
        
        # Block access to other file types
        location ~* \.(php|html|htm|js)$ {
            deny all;
        }
    }

    # Streaming endpoint for large file downloads
    location /stream/ {
        limit_req zone=files burst=5 nodelay;
        
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        
        # Extended timeouts for large files
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Enable range requests
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Default location - proxy everything else to the app
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}