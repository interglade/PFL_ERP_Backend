services:

  # NOTE: app service removed — run locally with "npm start"
  # Connects to postgres on localhost:6500 and redis on localhost:6379

  # ─────────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy + Static File Server
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_primefresh
    ports:
      - "8004:8004"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # SSL certificates (optional)
      - nginx_logs:/var/log/nginx
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - primefresh_network

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 17 Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres_primefresh
    ports:
      - "6500:5432"           # Exposed to host for pgAdmin / migrations
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro  # Init SQL scripts
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: node_typeorm
      TZ: Asia/Kolkata
    restart: unless-stopped
    networks:
      - primefresh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d node_typeorm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Redis 7 — Cache + Token Blacklist Store
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_primefresh
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - primefresh_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # pgAdmin 4 — PostgreSQL Web UI (dev/admin use only)
  # ─────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_primefresh
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password123
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "9000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - primefresh_network

# ─────────────────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redis_data:
  pgadmin_data:
  nginx_logs:

# ─────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────
networks:
  primefresh_network:
    driver: bridge
